name: Build

on:
  push:
    tags:     [ 'v*.*.*' ]      # Tag build — creates a draft release
  release:
    types: [published]

jobs:
  build:
    name: PlatformIO build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: |
          pio run -e tdeck
          pio run -e cardputer-cap
          pio run -e heltec-v4
          pio run -e heltec-v4-vertical

      # ── Rename artifacts to include tag version ───────────────
      - name: Collect artifacts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF_NAME}
          mkdir dist

          cp .pio/build/tdeck/firmware.bin  dist/camillia-mt-tdeck-${TAG}.bin
          cp .pio/build/tdeck/firmware.elf  dist/camillia-mt-tdeck-${TAG}.elf
          cp .pio/build/tdeck/firmware.map  dist/camillia-mt-tdeck-${TAG}.map 2>/dev/null || true

          cp .pio/build/cardputer-cap/firmware.bin  dist/camillia-mt-cardputer-cap-${TAG}.bin
          cp .pio/build/cardputer-cap/firmware.elf  dist/camillia-mt-cardputer-cap-${TAG}.elf
          cp .pio/build/cardputer-cap/firmware.map  dist/camillia-mt-cardputer-cap-${TAG}.map 2>/dev/null || true

          cp .pio/build/heltec-v4/firmware.bin  dist/camillia-mt-heltec-${TAG}.bin
          cp .pio/build/heltec-v4/firmware.elf  dist/camillia-mt-heltec-${TAG}.elf
          cp .pio/build/heltec-v4/firmware.map  dist/camillia-mt-heltec-${TAG}.map 2>/dev/null || true

          cp .pio/build/heltec-v4-vertical/firmware.bin  dist/camillia-mt-heltec-vertical-${TAG}.bin
          cp .pio/build/heltec-v4-vertical/firmware.elf  dist/camillia-mt-heltec-vertical-${TAG}.elf
          cp .pio/build/heltec-v4-vertical/firmware.map  dist/camillia-mt-heltec-vertical-${TAG}.map 2>/dev/null || true

      # ── Draft release with all firmware artifacts attached ────
      - name: Create draft release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.bin
            dist/*.elf
            dist/*.map
