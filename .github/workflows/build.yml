name: Build

on:
  push:
    tags:     [ 'v*.*.*' ]      # Tag build — compile-only verification gate

# IMPORTANT: this workflow must NOT publish release assets.
#
# release.sh is the single source of truth for published artifacts: it builds,
# merges the factory images, copies the app-only OTA images, and signs each
# -ota.bin with the private ECDSA key (which lives only on the release machine,
# never in CI). It then uploads every .bin/.elf/.sig via `gh release create`.
#
# If CI also published dist/*.bin, its independently-built binaries would
# overwrite the exact bytes release.sh signed — while the detached .sig stayed
# put — so the on-device signature check would reject every OTA image. CI has
# no signing key, so it can never produce a matching pair. This job therefore
# only compiles every environment to catch build breakage on a clean checkout.

jobs:
  build:
    name: PlatformIO build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio esptool

      - name: Build firmware (verify all environments compile)
        run: |
          pio run -e tdeck
          pio run -e tlora-pager-tft
          pio run -e cardputer-cap
          pio run -e heltec-v4
          pio run -e heltec-v4-vertical

      # Archive debug symbols as workflow artifacts instead of bloating the
      # public release with ~35MB ELF files per environment. NOTE: these come
      # from THIS CI build, which is not guaranteed byte-identical to the
      # release.sh-built (and signed) binaries actually shipped, so addresses
      # may drift. For exact crash symbolication use the dist/*.elf produced on
      # the machine that ran release.sh.
      - name: Archive debug symbols (ELF/MAP)
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ github.ref_name }}
          path: |
            .pio/build/*/firmware.elf
            .pio/build/*/firmware.map
          if-no-files-found: warn
          retention-days: 90
