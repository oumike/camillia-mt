name: Build

on:
  push:
    branches: [ main ]          # Primary: catch breakage while it's cheap to fix
    tags:     [ 'v*.*.*' ]      # Per-release record of the tagged tree
  pull_request:
    branches: [ main ]

# What this job is actually for: building from a CLEAN CHECKOUT.
#
# A local `pio run` reuses .pio caches and can see untracked files, so it cannot
# catch an uncommitted header or a .gitignore'd dependency. This job can, and
# that is the whole of its value.
#
# It is NOT a release gate, despite the tag trigger. release.sh pushes the tag
# and then publishes seconds later, while this job spends minutes installing
# PlatformIO and building every environment — so the release is always public
# before CI has an opinion. The branch trigger above is the one that earns its
# keep: it runs on the commit release.sh pushes just before tagging, and on
# every ordinary push in between. To make it a real gate, release.sh would have
# to wait on the run (`gh run watch`) before `gh release create`.
#
# IMPORTANT: this workflow must NOT publish release assets.
#
# release.sh is the single source of truth for published artifacts: it builds,
# merges the factory images, copies the app-only OTA images, and signs each
# -ota.bin with the private ECDSA key (which lives only on the release machine,
# never in CI). It then uploads every .bin/.sig via `gh release create`.
#
# If CI also published dist/*.bin, its independently-built binaries would
# overwrite the exact bytes release.sh signed — while the detached .sig stayed
# put — so the on-device signature check would reject every OTA image. CI has
# no signing key, so it can never produce a matching pair.

jobs:
  build:
    name: PlatformIO build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio esptool

      - name: Build firmware (verify all environments compile)
        run: |
          pio run -e tdeck
          pio run -e tlora-pager-tft
          pio run -e cardputer-cap
          pio run -e heltec-v4
          pio run -e heltec-v4-vertical
          pio run -e mesh-deck
          pio run -e m9

      # Debug symbols are deliberately not archived here. CI's build is not
      # byte-identical to the release.sh-built, signed binaries that actually
      # ship, so its addresses can drift — symbolicating a real crash against
      # them is misleading. Use the dist/*.elf left on the machine that ran
      # release.sh, which matches the shipped image exactly.
