name: Build

on:
  push:
    branches: [ main ]          # Primary: catch breakage while it's cheap to fix
    # Skip the ~20 minute build for pushes that cannot change a binary.
    # RELEASE_NOTES.md is deliberately NOT in this list: the build bakes it into
    # the firmware via tools/gen_release_notes.py, so editing it does change
    # every image.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'HANDOFF-*.md'
      - '.gitignore'
  pull_request:
    branches: [ main ]

# Only the newest push on a ref is worth checking — a burst of commits used to
# queue a full 9-environment build for each one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# What this job is actually for: building from a CLEAN CHECKOUT.
#
# A local `pio run` reuses .pio caches and can see untracked files, so it cannot
# catch an uncommitted header or a .gitignore'd dependency. This job can, and
# that is the whole of its value.
#
# It is a breakage check on ordinary work, not a release gate. Releases are cut
# by .github/workflows/release.yml, which does its own clean build of every
# environment before it signs anything — so this job has nothing left to gate.
#
# There is deliberately no tag trigger. It used to exist to keep a per-release
# record of the tagged tree, which release.yml now supersedes; it would also be
# dead weight, since pushes made with the default GITHUB_TOKEN do not trigger
# other workflows and every release tag now comes from that job.
#
# IMPORTANT: this workflow must NOT publish release assets.
#
# release.yml is the single source of truth for published artifacts: it builds,
# merges the factory images, copies the app-only OTA images, and signs each
# -ota.bin with the private ECDSA key (held as the OTA_SIGNING_KEY secret on the
# `release` environment, and reachable from nowhere else). It then uploads every
# .bin/.sig via `gh release create`.
#
# If this workflow also published dist/*.bin, its independently-built binaries
# would overwrite the exact bytes release.sh signed — while the detached .sig
# stayed put — so the on-device signature check would reject every OTA image.
# This job has no access to the signing key, so it can never produce a matching
# pair.

jobs:
  build:
    name: PlatformIO build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release target contract
        run: ./release.sh --check-targets

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio esptool

      - name: Build firmware (verify all environments compile)
        run: |
          pio run -e tdeck
          pio run -e tdeck-pro
          pio run -e tlora-pager-tft
          pio run -e cardputer-cap
          pio run -e heltec-v4
          pio run -e heltec-v4-vertical
          pio run -e mesh-deck
          pio run -e m9
          pio run -e wio-tracker-l2

      # Debug symbols are deliberately not archived here. This build is not
      # byte-identical to the signed binaries that actually ship, so its
      # addresses can drift — symbolicating a real crash against them is
      # misleading. Use the debug-symbols-<tag> artifact from the release.yml
      # run that published the firmware; those match the shipped image exactly.
