[env:heltec-v4]
platform  = espressif32@7.0.1
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

board_build.arduino.memory_type = qio_qspi
# board_upload.* matters as much as board_build.flash_size, for the reason
# spelled out on the mesh-deck env below: the esp32-s3-devkitc-1 board
# definition declares an 8 MB part, and that is the size the bootloader is
# built against. A partition table reaching past 8 MB is rejected before any
# app code runs, and the board resets inside the bootloader with nothing on
# serial but the ROM banner. The old 6.75 MB table hid this.
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = partitions.csv

# Regenerates src/release_notes.h from RELEASE_NOTES.md before each build.
extra_scripts =
    pre:tools/gen_release_notes.py
    pre:tools/patch_lgfx_dmadesc.py

build_flags =
    -DDEVICE_HELTEC_V4_EXPANSION=1
    -DRADIOLIB_EXCLUDE_APRS=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DUI_LVGL_POC=1
    -DLV_CONF_INCLUDE_SIMPLE
    # NimBLE build options (issue #40). This device is only ever a BLE
    # central -- it connects out to a keyboard and never advertises -- so the
    # peripheral and broadcaster roles are compiled out, and one connection
    # is all a keyboard needs. Both trim flash and, more importantly here,
    # internal DRAM. The log level is dropped from the library's default of 5
    # (verbose) because every level compiled in is another block of format
    # strings in flash for output nobody reads.
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=2
    -Isrc
    -Isrc/hal
    -std=gnu++17
    -Os
    !echo "-DAPP_VERSION=\\\"$(cat VERSION | tr -d '\\n')\\\""

# RadioLib raises an advisory #warning on every TU that includes it whenever
# ARDUINO_USB_CDC_ON_BOOT=1 (RadioLib.h:67), telling us to use a hardware UART
# for debug output. USB CDC is the only console these boards expose, so the
# advice cannot be taken and the warning is pure noise -- four copies per build.
#
# build_src_flags, not build_flags: it applies to src/ only, which is where all
# four copies come from (the four of our files that include mesh_radio.h).
# RadioLib's own sources keep full warnings. The cost is that a #warning we add
# in src/ would also be silenced; there are none today.
build_src_flags = -Wno-cpp

build_unflags =
    -std=gnu++11

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    jgromes/RadioLib@^7.7.1
    mikalhart/TinyGPSPlus@^1.0.3
    rweather/Crypto@^0.4.0
    adafruit/Adafruit BME280 Library@^2.3.0
    adafruit/Adafruit BMP280 Library@^3.0.0
    adafruit/Adafruit Unified Sensor@^1.1.15
    https://github.com/Quency-D/chsc6x/archive/3b2b6cebf3177b3e2c33d06e07909b0b10159516.zip
    lvgl/lvgl@9.5.0
    knolleary/PubSubClient@^2.8
    # BLE keyboard host (issue #40). Pinned to the 1.x line on purpose: the
    # 2.x line requires Arduino core 3.x and this platform ships core 2.0.17,
    # so a fresh resolve of "^2" -- which is what pio picks unprompted --
    # does not build. Only BLE-keyboard-enabled envs pull it in.
    h2zero/NimBLE-Arduino@^1.4.3

build_src_filter =
    +<main_lvgl.cpp>
    +<vnc_host.cpp>
    +<mqtt_bridge.cpp>
    +<keyboard.cpp>
    +<battery_util.cpp>
    +<emoji_font.cpp>
    +<env_sensor.cpp>
    +<gps.cpp>
    +<los.cpp>
    +<config_io.cpp>
    +<storage.cpp>
    +<base64_util.cpp>
    +<web_config.cpp>
    +<ota_update.cpp>
    +<mesh_radio.cpp>
    +<mesh_proto.cpp>
    +<channel_mgr.cpp>
    +<dm_mgr.cpp>
    +<node_db.cpp>
    +<live_util.cpp>
    +<live_feed.cpp>
    +<debug_flags.cpp>
    +<ignore_list.cpp>
    +<ble_keyboard.cpp>

