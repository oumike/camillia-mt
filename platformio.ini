[env:tdeck]
platform  = espressif32@7.0.1
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed  = 115200

board_build.arduino.memory_type = qio_opi
board_build.flash_size          = 16MB
board_build.partitions          = partitions.csv

# Regenerates src/release_notes.h from RELEASE_NOTES.md before each build.
extra_scripts = pre:tools/gen_release_notes.py

build_flags =
    -DDEVICE_TDECK=1
    -DRADIOLIB_EXCLUDE_APRS=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DUI_LVGL_POC=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
    -Isrc/hal
    -std=gnu++17
    -Os
    !echo "-DAPP_VERSION=\\\"$(cat VERSION | tr -d '\\n')\\\""

build_unflags =
    -std=gnu++11

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    jgromes/RadioLib@^7.7.1
    mikalhart/TinyGPSPlus@^1.0.3
    rweather/Crypto@^0.4.0
    lvgl/lvgl@9.5.0
    knolleary/PubSubClient@^2.8

build_src_filter =
    +<main_lvgl.cpp>
    +<vnc_host.cpp>
    +<mqtt_bridge.cpp>
    +<keyboard.cpp>
    +<battery_util.cpp>
    +<emoji_font.cpp>
    +<env_sensor.cpp>
    +<gps.cpp>
    +<config_io.cpp>
    +<storage.cpp>
    +<base64_util.cpp>
    +<web_config.cpp>
    +<ota_update.cpp>
    +<mesh_radio.cpp>
    +<mesh_proto.cpp>
    +<channel_mgr.cpp>
    +<dm_mgr.cpp>
    +<node_db.cpp>
    +<live_util.cpp>
    +<live_feed.cpp>
    +<debug_flags.cpp>
    +<ignore_list.cpp>

