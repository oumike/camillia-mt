# ── Attaky Mesh Deck 1.0 ──────────────────────────────────────────────────────
# Modular frame: Core ESP32 (S3-WROOM-1U-N16R8) + LoRa/GPS expansion + 48-key
# keyboard + Standard Cell power. See src/hal/hw_mesh_deck.h.
#
# Attaky publishes signal roles per connector position but no F-BTB -> GPIO
# table, so this env used to fail loudly rather than build against a guessed pin
# map. That map is now filled in and cross-checked against a working port, and
# hw_mesh_deck.h defines MESH_DECK_PINS_KNOWN, so the target builds.
[env:mesh-deck]
platform  = espressif32@7.0.1
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed  = 1500000

# N16R8: 16 MB quad flash, 8 MB octal PSRAM.
#
# board_upload.* matters as much as board_build.flash_size here: the
# esp32-s3-devkitc-1 board definition declares an 8 MB part, and that is the
# size the bootloader is built against. A partition table reaching past 8 MB is
# then rejected before any app code runs — the device resets inside the
# bootloader, over and over, with no serial output beyond the ROM banner. The
# old 6.44 MB table hid this; partitions_16mb_fs.csv fills the full 16 MB.
board_build.arduino.memory_type = qio_opi
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216

# Do not let esptool restart the board after flashing.
#
# A power-up boot on this hardware is reliable; a warm reset over EN straight
# out of download mode is not — the panel lights, the splash appears, and it
# then hangs until power is removed. Whatever state that leaves behind lives in
# something that survives a CPU reset (the expanders, the panel, PSRAM), and no
# driver-level change moved it.
#
# Leaving the board halted after upload turns a confusing hang into an explicit
# step: flash, then power on. It also gives better logs — with the monitor
# already attached when you power up, the capture starts at the ROM banner
# instead of a second or two into boot.
board_upload.after_reset        = no_reset
board_build.partitions          = partitions_16mb_fs.csv

extra_scripts =
    pre:tools/gen_release_notes.py
    pre:tools/patch_lgfx_dmadesc.py

build_flags =
    -DDEVICE_MESH_DECK=1
    # Bring-up diagnostics: a 1 Hz touch/keyboard status line, per-tap touch
    # coordinates, every key after remapping, and a report for presses on
    # unmapped matrix positions. All off now that touch, both keyboard halves
    # and the symbol key are working. Uncomment to bring them back — the code
    # is still there and costs nothing while the flag is undefined.
    # -DMESH_DECK_TOUCH_TRACE=1
    -DRADIOLIB_EXCLUDE_APRS=1
    # Serial goes to UART0 (GPIO43/44) and out through the board's USB-UART
    # bridge, which is why the device enumerates as /dev/cu.usbserial-*. The
    # other targets here use the S3's native USB CDC and set both to 1; doing
    # that on this board sends every log line to a port that is not connected.
    # Matches the Attaky board definition in the wadamesh port.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DBOARD_HAS_PSRAM
    -DUI_LVGL_POC=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
    -Isrc/hal
    -std=gnu++17
    -Os
    !echo "-DAPP_VERSION=\\\"$(cat VERSION | tr -d '\\n')\\\""

build_unflags =
    -std=gnu++11
    # The esp32-s3-devkitc-1 board definition hard-codes -DARDUINO_USB_MODE=1.
    # This board routes its console to UART0 instead, so build_flags sets 0 —
    # and a macro redefined with a *different* value warns on every translation
    # unit (an identical one would be silent, which is why no other env shows
    # this). Drop the board's value rather than shout past it.
    -DARDUINO_USB_MODE=1

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    jgromes/RadioLib@^7.7.1
    mikalhart/TinyGPSPlus@^1.0.3
    rweather/Crypto@^0.4.0
    lvgl/lvgl@9.5.0
    knolleary/PubSubClient@^2.8

build_src_filter =
    +<main_lvgl.cpp>
    +<vnc_host.cpp>
    +<mqtt_bridge.cpp>
