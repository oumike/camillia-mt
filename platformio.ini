[env:m9]
# Elecrow ThinkNode M9 — ESP32-S3R8, LR1110 radio, 2.4" ST7789, QWERTY keyboard.
# Pin map lives in src/hal/hw_m9.h; see that file for what was verified on
# hardware versus read off the schematic.
platform  = espressif32@7.0.1
board     = thinknode_m9
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_size          = 16MB
board_build.partitions          = partitions.csv

# patch_radiolib_lr11x0: preproduction M9 LR1110s run transceiver firmware
# older than 0x0308, which rejects RadioLib's unconditional
# DriveDiosInSleepMode and turns begin() into -706. See the script.
extra_scripts =
    pre:tools/gen_release_notes.py
    pre:tools/patch_lgfx_dmadesc.py
    pre:tools/patch_radiolib_lr11x0.py
    post:tools/m9_upload_erase.py

build_flags =
    -DDEVICE_M9=1
    -DRADIOLIB_EXCLUDE_APRS=1
    # Console is an external UART bridge, NOT native USB-CDC. With CDC on boot
    # the logs go to a ttyACM port this board does not expose and the device
    # looks completely silent.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DUI_LVGL_POC=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
    -Isrc/hal
    -std=gnu++17
    -Os
    !echo "-DAPP_VERSION=\\\"$(cat VERSION | tr -d '\\n')\\\""

# No -Wno-cpp here, unlike the CDC boards: RadioLib's USB-CDC advisory only
# fires when ARDUINO_USB_CDC_ON_BOOT=1, which this board does not set.

build_unflags =
    -std=gnu++11

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    jgromes/RadioLib@^7.7.1
    mikalhart/TinyGPSPlus@^1.0.3
    rweather/Crypto@^0.4.0
    lvgl/lvgl@9.5.0
    knolleary/PubSubClient@^2.8

build_src_filter =
    +<main_lvgl.cpp>
    +<vnc_host.cpp>
    +<mqtt_bridge.cpp>
    +<keyboard.cpp>
    +<battery_util.cpp>
    +<emoji_font.cpp>
    +<env_sensor.cpp>
    +<gps.cpp>
    +<los.cpp>
    +<config_io.cpp>
    +<storage.cpp>
    +<base64_util.cpp>
    +<web_config.cpp>
    +<ota_update.cpp>
    +<mesh_radio.cpp>
    +<mesh_proto.cpp>
    +<channel_mgr.cpp>
    +<dm_mgr.cpp>
    +<node_db.cpp>
    +<live_util.cpp>
    +<live_feed.cpp>
    +<debug_flags.cpp>
    +<ignore_list.cpp>

# ── Square ────────────────────────────────────────────────────────────────────
# ESP32-S3, 16 MB flash, 8 MB octal PSRAM. QSPI NV3031B panel, LP5814 I2C
# backlight, GT911 touch, and a PCA9555 expander that gates nearly every rail.
# Text entry uses the on-screen keyboard by default and can optionally merge
# input from a paired BLE keyboard through the same pipeline.
# See src/hal/hw_square.h and issue #56.
[env:square]
platform  = espressif32@7.0.1
board     = square
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

board_build.arduino.memory_type = qio_opi
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = partitions_16mb_fs.csv

# Regenerates src/release_notes.h from RELEASE_NOTES.md before each build.
extra_scripts =
    pre:tools/gen_release_notes.py
    pre:tools/patch_lgfx_dmadesc.py

build_flags =
    -DDEVICE_SQUARE=1
    -DRADIOLIB_EXCLUDE_APRS=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DUI_LVGL_POC=1
    -DLV_CONF_INCLUDE_SIMPLE
    # BLE keyboard host: central-only, one connection, low log level. NimBLE
    # 1.x is required by Arduino core 2.0.17.
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=2
    -Isrc
    -Isrc/hal
    -std=gnu++17
    -Os
    !echo "-DAPP_VERSION=\\\"$(cat VERSION | tr -d '\\n')\\\""

build_src_flags = -Wno-cpp

build_unflags =
    -std=gnu++11

# LovyanGFX 1.2.27, not the ^1.1.16 every other display env pins: Panel_NV3031B
# does not exist before 1.2.27. PlatformIO gives each environment its own
# libdeps copy, so this upgrade is scoped to this board and the other six are
# untouched -- tools/patch_lgfx_dmadesc.py already relies on that isolation.
lib_deps =
    lovyan03/LovyanGFX@1.2.27
    adafruit/Adafruit ADS1X15@2.6.2
    jgromes/RadioLib@^7.7.1
    mikalhart/TinyGPSPlus@^1.0.3
    rweather/Crypto@^0.4.0
    lvgl/lvgl@9.5.0
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^1.4.3
    https://github.com/pschatzmann/arduino-audio-driver/archive/v0.3.0.zip

build_src_filter =
    +<main_lvgl.cpp>
    +<vnc_host.cpp>
    +<mqtt_bridge.cpp>
    +<keyboard.cpp>
    +<battery_util.cpp>
    +<emoji_font.cpp>
    +<env_sensor.cpp>
    +<gps.cpp>
    +<los.cpp>
    +<config_io.cpp>
    +<storage.cpp>
    +<base64_util.cpp>
    +<web_config.cpp>
    +<ota_update.cpp>
    +<mesh_radio.cpp>
    +<hal/xl9555.cpp>
    +<hal/square_io.cpp>
    +<mesh_proto.cpp>
    +<channel_mgr.cpp>
    +<dm_mgr.cpp>
    +<node_db.cpp>
    +<live_util.cpp>
    +<live_feed.cpp>
    +<debug_flags.cpp>
    +<ignore_list.cpp>
    +<ble_keyboard.cpp>
