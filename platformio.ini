[env:tdeck]
platform  = espressif32@6.7.0
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed  = 115200

board_build.arduino.memory_type = qio_opi
board_build.flash_size          = 16MB
board_build.partitions          = partitions.csv

build_flags =
    -DDEVICE_TDECK=1
    -DRADIOLIB_EXCLUDE_APRS=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DUI_LVGL_POC=1
    -DLV_CONF_PATH=lv_conf.h
    -Isrc
    -Isrc/hal
    -std=gnu++17
    -Os
    -Wl,--wrap=_ZN16WiFiClientSecure7connectEPKct
    -Wl,--wrap=_ZN16WiFiClientSecure7connectEPKcti
    -Wl,--wrap=_Z16start_ssl_clientP17sslclient_contextRK9IPAddressjPKciS5_bS5_S5_S5_S5_bPS5_
    !echo "-DAPP_VERSION=\\\"$(cat VERSION | tr -d '\\n')\\\""

build_unflags =
    -std=gnu++11

lib_deps =
    lovyan03/LovyanGFX@^1.1.16
    jgromes/RadioLib@^6.0.0
    mikalhart/TinyGPSPlus@^1.0.3
    rweather/Crypto@^0.4.0
    lvgl/lvgl@8.3.11

build_src_filter =
    +<main_lvgl.cpp>
    +<keyboard.cpp>
    +<battery_util.cpp>
    +<env_sensor.cpp>
    +<gps.cpp>
    +<config_io.cpp>
    +<base64_util.cpp>
    +<web_config.cpp>
    +<ota_update.cpp>
    +<mesh_radio.cpp>
    +<mesh_proto.cpp>
    +<channel_mgr.cpp>
    +<dm_mgr.cpp>
    +<node_db.cpp>
    +<live_util.cpp>
    +<live_feed.cpp>
    +<debug_flags.cpp>
    +<ignore_list.cpp>

